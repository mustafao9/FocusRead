<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>FocusRead</title>
  <link rel="stylesheet" href="style.css">
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/html2canvas.min.js"></script>
</head>
<body>

  <!-- Yüzen Kalem Paleti -->
  <div id="highlight-palette">
    <span class="pen-dot" data-color="fr-hl-yellow" style="background:#fef08a;"></span>
    <span class="pen-dot" data-color="fr-hl-green" style="background:#bbf7d0;"></span>
    <span class="pen-dot" data-color="fr-hl-blue" style="background:#bae6fd;"></span>
    <span class="pen-dot" data-color="fr-hl-pink" style="background:#fbcfe8;"></span>
  </div>

  <!-- AI Özet Modali -->
  <div id="ai-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="ai-modal-title">✨ Yapay Zeka İçerik Özeti</div>
        <span id="ai-modal-close" class="modal-close">✕</span>
      </div>
      <div id="ai-summary-text" class="modal-body">...</div>
    </div>
  </div>

  <!-- Hakkımızda Modali -->
  <div id="about-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="about-modal-title">ℹ️ Hakkımızda</div>
        <span id="about-modal-close" class="modal-close">✕</span>
      </div>
      <div id="about-modal-body" class="modal-body">...</div>
    </div>
  </div>

  <!-- PDF Ön İzleme ve İndirme Modali -->
  <div id="pdf-preview-modal" class="modal-overlay">
    <div class="modal-box" style="max-width: 850px; height: 90vh;">
      <div class="modal-header">
        <div class="modal-title" id="pdf-modal-title">📄 PDF Arşiv Belgesi Ön İzleme</div>
        <span id="pdf-modal-close" class="modal-close">✕</span>
      </div>
      <div class="modal-body" style="flex: 1; padding: 0; overflow: hidden; background: #525659; display: flex; justify-content: center; align-items: center;">
        <iframe id="pdf-preview-iframe" style="width: 100%; height: 100%; border: none;"></iframe>
      </div>
      <div style="padding: 12px 0 0 0; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #e2e8f0; margin-top: 10px;">
        <button class="tool-btn" id="btn-pdf-cancel" style="background: #e2e8f0;">Kapat</button>
        <button class="tool-btn btn-pdf" id="btn-pdf-download-action">📥 PDF Olarak İndir</button>
      </div>
    </div>
  </div>

  <!-- Üst Araç Çubuğu -->
  <div class="top-toolbar">
    <div class="tool-group" style="display: flex; align-items: center;">
      <img src="FocusRead.svg" alt="FocusRead Logo" style="height: 28px; width: auto; display: block;">
    </div>
    <div class="tool-group">
      <button class="tool-btn btn-ai" id="btn-ai-summarize">🤖 Yapay Zeka Özeti</button>
      <button class="tool-btn" id="btn-font-minus">A-</button>
      <button class="tool-btn" id="btn-font-plus">A+</button>
      <button class="tool-btn" id="btn-toggle-dark">🌙 Gece Modu</button>
      <button class="tool-btn btn-about" id="btn-about">ℹ️ Hakkımızda</button>
      <button class="tool-btn btn-support" id="btn-support">☕ Destek Ol</button>
      <button class="tool-btn btn-pdf" id="btn-save-pdf">📄 PDF / Ön İzle & İndir</button>
    </div>
  </div>

  <!-- Ekran Okuma Konteynırı -->
  <div class="container" id="main-container">
    <h1 id="article-title">...</h1>
    <div id="article-copyright" class="article-copyright"></div>
    <div id="article-content"></div>
  </div>

  <script src="reader.js"></script>
  <script src="pdf-engine.js"></script>
</body>
</html>
