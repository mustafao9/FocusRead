<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>FocusRead</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: #fcfbf7;
      color: #292929;
      line-height: 1.7;
      transition: background-color 0.2s, color 0.2s;
    }
    .top-toolbar {
      position: sticky;
      top: 0;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      z-index: 1000;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .tool-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .tool-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      transition: all 0.15s ease;
    }
    .tool-btn:hover { background: #e2e8f0; transform: translateY(-1px); }
    .btn-ai { background: #8b5cf6; color: #fff; border: none; }
    .btn-ai:hover { background: #7c3aed; }
    .btn-wa { background: #25d366; color: #fff; border: none; }
    .btn-wa:hover { background: #1da851; }
    .btn-pdf { background: #0284c7; color: #fff; border: none; }
    .btn-pdf:hover { background: #0369a1; }

    /* Yüzen İşaretleme Paleti */
    #highlight-palette {
      position: absolute;
      display: none;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      z-index: 99999;
      gap: 8px;
      align-items: center;
    }
    .pen-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.15s;
    }
    .pen-dot:hover { transform: scale(1.3); }

    /* Açılır Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 999999;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      background: #ffffff;
      width: 90%;
      max-width: 650px;
      max-height: 80vh;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      color: #6b21a8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-close {
      font-size: 20px;
      color: #94a3b8;
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
    }
    .modal-close:hover { color: #0f172a; }
    .modal-body {
      font-size: 15px;
      line-height: 1.7;
      color: #334155;
      overflow-y: auto;
      padding-right: 8px;
    }

    .container {
      max-width: 760px;
      margin: 20px auto 40px auto;
      padding: 0 20px;
    }
    h1#article-title {
      font-size: 26px;
      line-height: 1.3;
      margin-bottom: 8px;
      color: #111827;
      font-family: system-ui, sans-serif;
    }
    .article-copyright {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
      font-family: system-ui, sans-serif;
      word-break: break-all;
    }

    .print-header {
      display: none;
    }

    /* Vurgu Renkleri */
    mark.fr-hl-yellow { background-color: #fef08a; color: #000; padding: 2px 4px; border-radius: 3px; }
    mark.fr-hl-green { background-color: #bbf7d0; color: #000; padding: 2px 4px; border-radius: 3px; }
    mark.fr-hl-blue { background-color: #bae6fd; color: #000; padding: 2px 4px; border-radius: 3px; }
    mark.fr-hl-pink { background-color: #fbcfe8; color: #000; padding: 2px 4px; border-radius: 3px; }

    /* Gece Modu */
    body.dark-theme {
      background-color: #121212 !important;
      color: #d1d5db !important;
    }
    body.dark-theme .top-toolbar { background: #1e293b; border-color: #334155; }
    body.dark-theme .tool-btn { background: #334155; color: #f8fafc; border-color: #475569; }
    body.dark-theme h1#article-title { color: #f9fafb; }

    /* PDF / PRINT DÜZENLEMESİ */
    @media print {
      @page {
        margin: 8mm 8mm 8mm 8mm;
      }
      html, body {
        background-color: #ffffff !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .top-toolbar, #highlight-palette, .modal-overlay {
        display: none !important;
      }
      .print-header {
        display: block !important;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
        font-weight: bold;
        color: #0284c7;
        margin-bottom: 12px;
        border-bottom: 2px solid #0284c7;
        padding-bottom: 4px;
      }
      .container {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      h1#article-title {
        font-size: 20px !important;
        margin: 0 0 6px 0 !important;
        padding: 0 !important;
      }
      .article-copyright {
        margin-bottom: 10px !important;
        padding-bottom: 6px !important;
      }
      img {
        max-height: 220px !important;
        width: auto !important;
        object-fit: contain !important;
      }
      div {
        margin-top: 5px !important;
        margin-bottom: 5px !important;
      }
      p {
        margin-top: 0 !important;
        margin-bottom: 10px !important;
        line-height: 1.4 !important;
        font-size: 15px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Yüzen Kalem Paleti -->
  <div id="highlight-palette">
    <span class="pen-dot" data-color="fr-hl-yellow" style="background:#fef08a;" id="pen-yellow"></span>
    <span class="pen-dot" data-color="fr-hl-green" style="background:#bbf7d0;" id="pen-green"></span>
    <span class="pen-dot" data-color="fr-hl-blue" style="background:#bae6fd;" id="pen-blue"></span>
    <span class="pen-dot" data-color="fr-hl-pink" style="background:#fbcfe8;" id="pen-pink"></span>
  </div>

  <!-- Yapay Zeka Özet Penceresi (Modal) -->
  <div id="ai-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="ai-modal-title">✨ Yapay Zeka İçerik Özeti</div>
        <span id="modal-close-btn" class="modal-close">✕</span>
      </div>
      <div id="ai-summary-text" class="modal-body">...</div>
    </div>
  </div>

  <div class="top-toolbar">
    <div class="tool-group">
      <strong style="color:#0284c7; font-size:18px;">📖 FocusRead</strong>
    </div>
    <div class="tool-group">
      <button class="tool-btn btn-ai" id="btn-ai-summarize">🤖 Yapay Zeka Özeti</button>
      <button class="tool-btn" id="btn-font-minus">A-</button>
      <button class="tool-btn" id="btn-font-plus">A+</button>
      <button class="tool-btn" id="btn-toggle-dark">🌙 Gece Modu</button>
      <button class="tool-btn btn-wa" id="btn-share-wa">💬 WhatsApp</button>
      <button class="tool-btn btn-pdf" id="btn-save-pdf">📄 PDF / İndir</button>
    </div>
  </div>

  <div class="container">
    <div class="print-header">📖 FocusRead</div>
    <h1 id="article-title">...</h1>
    <div id="article-copyright" class="article-copyright"></div>
    <div id="article-content"></div>
  </div>

  <script src="reader.js"></script>
</body>
</html>
